academic_research: My doctoral research focused on <strong>energy-efficient AI chips and systems</strong> through
  algorithm–architecture–circuit co-design. I investigated SRAM/eDRAM-based computing-in-memory, approximate
  and floating-point computing, adaptive dataflows, and design-space exploration, spanning circuit design,
  accelerator architectures, and automated design tools. I led the design of <strong>six CIM accelerators,
  five of which were taped out</strong>. Earlier, my master’s research focused on lightweight intelligent sensing
  systems, model compression, and embedded inference.
achievements: I have published <strong>11 first-author papers (including two co-first-author papers)</strong>,
  with publications in leading journals and conferences such as <strong>JSSC, TCAS-I, ICCAD, DATE, and CICC</strong>.
  I received the <strong>National Scholarship (2025)</strong> and was named an <strong>Outstanding Graduate
  of Beijing and Peking University (2026)</strong>. My research publications are listed below.
