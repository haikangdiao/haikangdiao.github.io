intro: I am a Senior Researcher in Huawei’s Computing Product Line, selected for <strong>Huawei’s <a href="https://career.huawei.com/reccampportal/portal5/topminds.html">Top
  Minds</a></strong> Program. My work centers on <strong>Ascend system architecture</strong> and <strong>AI
  infrastructure design</strong>, with a focus on hardware–software co-design for AI computing systems.
biography: Prior to joining Huawei, I received my <strong>Ph.D. from the School of Integrated Circuits at Peking
  University</strong> in 2026, working with Prof. Yuan Wang and <a href="https://ic.pku.edu.cn/szdw/zzjs/jcdlsjx1/txy/index.htm">Prof.
  Xiyuan Tang</a>. I received my B.Eng. and M.S. degrees from Fudan University in 2019 and 2022, respectively,
  working with <a href="http://www.it.fudan.edu.cn/Data/View/1005/">Prof. Wei Chen</a> during my master’s studies.
